# Static Web and tile cache behind Caddy. Compose runs nginx as UID/GID 101.
# Keep nginx on loopback; Caddy owns the public HTTPS listener.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 8m;

    # Exclude query strings and cookies from access logs.
    log_format private_gateway '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout private_gateway;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # host-network containers use Ubuntu's local systemd-resolved stub.
    resolver 127.0.0.53 valid=300s ipv6=off;
    resolver_timeout 5s;
    proxy_cache_path /var/cache/nginx/osm levels=1:2 keys_zone=osm:8m
        max_size=1g inactive=30d use_temp_path=off;

    # Exact z/x/y ranges (z <= 19, 0 <= x/y < 2^z); no leading zeroes.
    # Captures only the fixed upstream path. Hosts and arbitrary URLs are never accepted.
    map $uri $osm_path {
        default "";
        "~^/tiles/osm(/0/0/0\\.png)$" $1;
        "~^/tiles/osm(/1/(?:0|1)/(?:0|1)\\.png)$" $1;
        "~^/tiles/osm(/2/(?:0|[1-2]|3)/(?:0|[1-2]|3)\\.png)$" $1;
        "~^/tiles/osm(/3/(?:0|[1-6]|7)/(?:0|[1-6]|7)\\.png)$" $1;
        "~^/tiles/osm(/4/(?:0|[1-9]|1[0-4]|15)/(?:0|[1-9]|1[0-4]|15)\\.png)$" $1;
        "~^/tiles/osm(/5/(?:0|[1-9]|[1-2][0-9]|30|31)/(?:0|[1-9]|[1-2][0-9]|30|31)\\.png)$" $1;
        "~^/tiles/osm(/6/(?:0|[1-9]|[1-5][0-9]|6[0-2]|63)/(?:0|[1-9]|[1-5][0-9]|6[0-2]|63)\\.png)$" $1;
        "~^/tiles/osm(/7/(?:0|[1-9]|[1-9][0-9]|1[0-1][0-9]|12[0-6]|127)/(?:0|[1-9]|[1-9][0-9]|1[0-1][0-9]|12[0-6]|127)\\.png)$" $1;
        "~^/tiles/osm(/8/(?:0|[1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-4]|255)/(?:0|[1-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-4]|255)\\.png)$" $1;
        "~^/tiles/osm(/9/(?:0|[1-9]|[1-9][0-9]|[1-4][0-9]{2}|50[0-9]|510|511)/(?:0|[1-9]|[1-9][0-9]|[1-4][0-9]{2}|50[0-9]|510|511)\\.png)$" $1;
        "~^/tiles/osm(/10/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|10[0-1][0-9]|102[0-2]|1023)/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|10[0-1][0-9]|102[0-2]|1023)\\.png)$" $1;
        "~^/tiles/osm(/11/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|1[0-9]{3}|20[0-3][0-9]|204[0-6]|2047)/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|1[0-9]{3}|20[0-3][0-9]|204[0-6]|2047)\\.png)$" $1;
        "~^/tiles/osm(/12/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-3][0-9]{3}|40[0-8][0-9]|409[0-4]|4095)/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-3][0-9]{3}|40[0-8][0-9]|409[0-4]|4095)\\.png)$" $1;
        "~^/tiles/osm(/13/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-7][0-9]{3}|80[0-9]{2}|81[0-8][0-9]|8190|8191)/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-7][0-9]{3}|80[0-9]{2}|81[0-8][0-9]|8190|8191)\\.png)$" $1;
        "~^/tiles/osm(/14/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|1[0-5][0-9]{3}|16[0-2][0-9]{2}|163[0-7][0-9]|1638[0-2]|16383)/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|1[0-5][0-9]{3}|16[0-2][0-9]{2}|163[0-7][0-9]|1638[0-2]|16383)\\.png)$" $1;
        "~^/tiles/osm(/15/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-2][0-9]{4}|3[0-1][0-9]{3}|32[0-6][0-9]{2}|327[0-5][0-9]|3276[0-6]|32767)/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-2][0-9]{4}|3[0-1][0-9]{3}|32[0-6][0-9]{2}|327[0-5][0-9]|3276[0-6]|32767)\\.png)$" $1;
        "~^/tiles/osm(/16/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-4]|65535)/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-4]|65535)\\.png)$" $1;
        "~^/tiles/osm(/17/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-9][0-9]{4}|1[0-2][0-9]{4}|130[0-9]{3}|1310[0-6][0-9]|131070|131071)/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-9][0-9]{4}|1[0-2][0-9]{4}|130[0-9]{3}|1310[0-6][0-9]|131070|131071)\\.png)$" $1;
        "~^/tiles/osm(/18/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-9][0-9]{4}|1[0-9]{5}|2[0-5][0-9]{4}|26[0-1][0-9]{3}|2620[0-9]{2}|2621[0-3][0-9]|26214[0-2]|262143)/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-9][0-9]{4}|1[0-9]{5}|2[0-5][0-9]{4}|26[0-1][0-9]{3}|2620[0-9]{2}|2621[0-3][0-9]|26214[0-2]|262143)\\.png)$" $1;
        "~^/tiles/osm(/19/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-9][0-9]{4}|[1-4][0-9]{5}|5[0-1][0-9]{4}|52[0-3][0-9]{3}|524[0-1][0-9]{2}|5242[0-7][0-9]|52428[0-6]|524287)/(?:0|[1-9]|[1-9][0-9]|[1-9][0-9]{2}|[1-9][0-9]{3}|[1-9][0-9]{4}|[1-4][0-9]{5}|5[0-1][0-9]{4}|52[0-3][0-9]{3}|524[0-1][0-9]{2}|5242[0-7][0-9]|52428[0-6]|524287)\\.png)$" $1;
    }

    map $upstream_http_content_type $osm_invalid_type {
        default 1;
        "~^image/png(?:;|$)" 0;
    }

    map $uri $static_cache_control {
        default "";
        /index.html "no-cache";
        "~^/assets/" "public, max-age=31536000, immutable";
    }

    server {
        listen 127.0.0.1:18080;
        listen 127.0.0.1:18443 ssl;
        http2 on;
        server_name localhost 127.0.0.1 lycoris-map.cn www.lycoris-map.cn;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:4m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        root /srv/frontend;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control $static_cache_control;

        location ~ ^/(api|uploads|health)(/|$) {
            proxy_pass http://127.0.0.1:18081;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            # Preserve Origin, Cookie and Authorization for the local Rust service.
            proxy_cache off;
            proxy_hide_header X-Lycoris-Media-Key;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location = /tiles/osm {
            return 404;
        }

        location /tiles/osm/ {
            if ($osm_path = "") { return 404; }
            if ($is_args != "") { return 404; }
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }

            # The existing Lycoris Worker provides the same fixed OSM tile route.
            # Direct OSM TLS connections time out from this Shanghai instance.
            # No API, account or media traffic uses this overseas upstream.
            proxy_pass https://lycoris-map.com/tiles/osm$osm_path;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name lycoris-map.com;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_ssl_verify_depth 3;
            proxy_set_header Host lycoris-map.com;
            proxy_set_header Connection "";

            # OSM policy: identify Lycoris, preserve the real Referer, and never
            # leak credentials or forward browser no-cache/bypass headers.
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header User-Agent "LycorisMaps/1.1 (+https://lycoris-map.com)";
            proxy_set_header Accept image/png;
            proxy_set_header Referer $http_referer;
            proxy_set_header Content-Length "";

            # Honor provider Cache-Control/Expires/ETag. Seven days is only the
            # fallback when upstream omits freshness; expired entries revalidate.
            proxy_cache osm;
            proxy_cache_key "https://lycoris-map.com/tiles/osm$osm_path";
            proxy_cache_methods GET HEAD;
            proxy_cache_revalidate on;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 20s;
            proxy_cache_lock_age 20s;
            proxy_cache_valid 200 7d;
            proxy_no_cache $osm_invalid_type $upstream_http_x_blocked;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_intercept_errors on;
            error_page 301 302 303 307 308 400 401 403 408 429 500 502 503 504 =502 @osm_unavailable;
            proxy_hide_header X-Lycoris-Tile-Source;
            proxy_hide_header X-Lycoris-Tile-Cache;

            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Lycoris-Tile-Source osm-shanghai-via-worker;
            add_header X-Lycoris-Tile-Cache $upstream_cache_status;
        }

        location @osm_unavailable {
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 502;
        }

        # Asset misses must be 404, never HTML with a JavaScript MIME type.
        location /assets/ {
            try_files $uri =404;
        }

        location ~ (^|/)\. {
            return 404;
        }

        # Browser deep links (including /admin) resolve to the React app.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
